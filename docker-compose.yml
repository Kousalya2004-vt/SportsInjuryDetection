version: '3.8'

services:
  # MySQL Database Container
  db:
    image: mysql:8.0
    container_name: kinetiq_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: Venkata@123
      MYSQL_DATABASE: sports_injury
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

  # Flask AI & Analytics Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: kinetiq_backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      - DB_HOST=db
      - DB_USER=root
      - DB_PASSWORD=Venkata@123
      - DB_NAME=sports_injury
    depends_on:
      - db

  # React Frontend Web Application
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: kinetiq_frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  db_data:
